<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貢寮社區APP</title>
    <!-- 1. 引入 LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <h1 class="mb-4 text-success fw-bold">🏡 貢寮社區服務平台</h1>
                
                <!-- 顯示身分驗證中的提示文字 -->
                <p id="status-text" class="text-muted mt-3">正在自動驗證您的 LINE 身分，請稍候...</p>
                
                <!-- 導覽按鈕區 (一開始先隱藏，等 LIFF 抓到身分後再顯示並自動帶入 user_id) -->
                <div id="menu-div" class="d-grid gap-3 col-10 mx-auto mt-4" style="display: none;">
                    <a href="#" id="carpool-link" class="btn btn-success btn-lg p-3 fw-bold fs-4">🚗 共乘車使用及預約</a>
                    <a href="#" id="calendar-link" class="btn btn-outline-success btn-lg p-3 fs-5">📅 社區共用行事曆</a>
                    <a href="#" id="sharing-link" class="btn btn-outline-success btn-lg p-3 fs-5">🍎 物資共享</a>
                    <button class="btn btn-outline-secondary btn-lg p-3 fs-5" disabled>✨ 待開發功能 </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 2. 填入你的 LINE LIFF ID
        const LIFF_ID = "2010804140-JvOp4dtv"; 

        liff.init({ liffId: LIFF_ID })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    // 如果尚未登入 LINE，自動引導登入
                    liff.login();
                } else {
                    // 登入成功後，取得使用者 Profile 裡的 userId
                    liff.getProfile().then(profile => {
                        const userId = profile.userId;
                        
                        // 3. 自動把抓到的 userId 附加到各個功能的網址後面
                        document.getElementById("carpool-link").href = `/carpool?user_id=${userId}`;
                        document.getElementById("calendar-link").href = `/calendar?user_id=${userId}`;
                        document.getElementById("sharing-link").href = `/sharing?user_id=${userId}`;

                        // 隱藏讀取文字，顯示完整選單
                        document.getElementById("status-text").style.display = "none";
                        document.getElementById("menu-div").style.display = "block";
                    }).catch(err => {
                        console.error("取得 LINE 個人資料失敗", err);
                        document.getElementById("status-text").innerText = "無法取得 LINE 身分，請重新整理。";
                    });
                }
            })
            .catch(err => {
                console.log("LIFF 初始化失敗（可能是在電腦端測試）", err);
                // 🛠️ 電腦本地端測試防護網：如果用電腦瀏覽器開，給予測試身分以免卡住
                document.getElementById("status-text").innerText = "目前為電腦測試模式 (GUEST)";
                document.getElementById("carpool-link").href = "/carpool?user_id=TEST_USER";
                document.getElementById("calendar-link").href = "/calendar?user_id=TEST_USER";
                document.getElementById("sharing-link").href = "/sharing?user_id=TEST_USER";
                document.getElementById("menu-div").style.display = "block";
            });
    </script>
</body>
</html>
